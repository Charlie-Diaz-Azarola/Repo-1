<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contador de Visitas · Población Diocesana</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100px;
      padding: 12px;
    }

    .contador {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 16px 24px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.04);
    }

    .label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #94a3b8;
      user-select: none;
    }

    .digitos {
      display: flex;
      gap: 3px;
      align-items: center;
    }

    .digito {
      width: 28px;
      height: 44px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 700;
      color: #1e293b;
      position: relative;
    }

    .digito.apagado {
      color: #cbd5e1;
    }

    .separador {
      width: 4px;
      height: 4px;
      background: #cbd5e1;
      border-radius: 50%;
      flex-shrink: 0;
      margin: 0 2px;
    }

    .subtitulo {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.5px;
      color: #94a3b8;
    }

    .error-msg {
      font-size: 14px;
      color: #94a3b8;
      letter-spacing: 3px;
      padding: 0 4px;
    }
  </style>
</head>
<body>

  <div class="contador">
    <span class="label">Visitas</span>
    <div class="digitos" id="digitos">
      <span class="error-msg">·····</span>
    </div>
    <div class="subtitulo">Población Diocesana</div>
  </div>

  <script>
    var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwTB7EyQ-ZJ1Bakr37ZcFoPZVACB94NkY8QaXHxsXv1CrtoSAixZr2XDh7laE8aHMQS/exec';
    var NUM_DIGITOS = 7;

    function renderDigitos(n) {
      var num = parseInt(n, 10) || 0;
      var significativo = String(num);
      var str = significativo.padStart(NUM_DIGITOS, '0');
      var cerosIniciales = NUM_DIGITOS - significativo.length;
      var container = document.getElementById('digitos');
      container.innerHTML = '';

      for (var i = 0; i < str.length; i++) {
        if (i > 0 && (str.length - i) % 3 === 0) {
          var sep = document.createElement('div');
          sep.className = 'separador';
          container.appendChild(sep);
        }
        var d = document.createElement('div');
        d.className = 'digito' + (i < cerosIniciales ? ' apagado' : '');
        d.textContent = str[i];
        container.appendChild(d);
      }
    }

    function cargarContador() {
      var nombre = '_gcb' + Date.now();
      window[nombre] = function(data) {
        renderDigitos(data.visitas);
        delete window[nombre];
        var s = document.getElementById('_jsonp');
        if (s) s.parentNode.removeChild(s);
      };
      var script = document.createElement('script');
      script.id = '_jsonp';
      script.src = SCRIPT_URL + '?cb=' + nombre;
      script.onerror = function() {
        document.getElementById('digitos').innerHTML = '<span class="error-msg">---</span>';
        delete window[nombre];
      };
      document.head.appendChild(script);
    }

    cargarContador();
  </script>

</body>
</html>
